name: Validate and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: JS syntax check (all app scripts + build tools)
        run: |
          for f in parser.js analyzer.js app.js report.js rma.js sw.js build.js; do
            node --check "$f" || exit 1
          done
          node --check scripts/build-version.mjs 2>/dev/null || true
      - name: Install dependencies (import-pipeline tests need xlsx)
        run: |
          corepack enable >/dev/null 2>&1 || true
          pnpm install --prefer-offline --silent
      - name: Data integrity + parser/analyzer smoke tests
        run: node --test tests/*.test.mjs

      # 去識別化：data.json 是公開可下載的（見 AI-HANDOFF「公開曝光現況」），
      # 客戶名稱與使用者全名不得寫回。匯入流程已自動遮罩，這一步是防回歸。
      - name: De-identification check (客戶名稱遮罩 + 姓名只留姓氏)
        run: node scripts/mask-identifiers.cjs --check

      - name: Version anchor consistency (v= params == sw.js CACHE_NAME)
        run: node scripts/check-version-anchors.mjs

      - name: Offline bundle build check (TITAN-STAR.html 必須可重現且已提交)
        run: |
          # build.js 需要 xlsx（Excel 模板匯入工具鏈），CI 只驗證打包不報錯，
          # 產出的 TITAN-STAR.html 由 pnpm-lock 凍結版本並由 build.js 統一 LF 換行
          corepack enable >/dev/null 2>&1 || true
          pnpm install --prefer-offline --silent
          node build.js
          ls -la TITAN-STAR.html
          if ! git diff --quiet -- TITAN-STAR.html; then
            echo "::error::TITAN-STAR.html 與原始碼不同步，請執行 node build.js 後一併 commit"
            exit 1
          fi
      - name: Pages artifact excludes internal docs
        run: bash scripts/prepare-pages-artifact.sh

  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Prepare public artifact
        run: bash scripts/prepare-pages-artifact.sh
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
