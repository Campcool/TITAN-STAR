name: Site check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JS syntax check (all app scripts + build tools)
        run: |
          for f in parser.js analyzer.js app.js report.js rma.js sw.js build.js; do
            node --check "$f" || exit 1
          done
          node --check scripts/build-version.mjs 2>/dev/null || true
      - name: Install dependencies (import-pipeline tests need xlsx)
        run: |
          corepack enable >/dev/null 2>&1 || true
          pnpm install --prefer-offline --silent
      - name: Data integrity + parser/analyzer smoke tests
        run: node --test tests/*.test.mjs

      - name: Version anchor consistency (v= params == sw.js CACHE_NAME)
        run: node scripts/check-version-anchors.mjs

      - name: Offline bundle build check (TITAN-STAR.html 必須能由 build.js 產出且不爆)
        run: |
          # build.js 需要 xlsx（Excel 模板匯入工具鏈），CI 只驗證打包不報錯，
          # 產出的 TITAN-STAR.html 由 pnpm-lock 凍結版本確保可重現
          corepack enable >/dev/null 2>&1 || true
          pnpm install --prefer-offline --silent
          node build.js
          ls -la TITAN-STAR.html
      - name: 確認 TITAN-STAR.html 未帶入 working tree 變更（打包產物不 commit）
        run: |
          # 打包單檔存在於 repo 內供離線使用，若內容被改動必須重新 build 後一併 commit
          git diff --quiet TITAN-STAR.html || echo "::warning::TITAN-STAR.html 與原始碼不同步，請 node build.js 後一併 commit"
